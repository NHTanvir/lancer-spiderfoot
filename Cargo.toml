[workspace]
resolver = "2"
members = [
    "lancer-spiderfoot",
    "sf-core",
    "sf-modules",
    "sf-graph",
    "sf-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
repository = "https://github.com/NHTanvir/lancer-spiderfoot"

[workspace.dependencies]
# Internal crates
sf-core = { path = "sf-core" }
sf-modules = { path = "sf-modules" }
sf-graph = { path = "sf-graph" }
sf-web = { path = "sf-web" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP — native-tls (schannel on Windows) to avoid ring/aws-lc NASM toolchain needs
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "socks", "default-tls"] }

# Persistence — runtime queries only (no compile-time DB needed)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

# Web
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
askama = "0.12"

# Graph
petgraph = "0.6"
rayon = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Concurrency / data structures
dashmap = "6"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
bloomfilter = "1"

# Rate limiting
governor = "0.6"

# Hashing / ids / random
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

# Time
chrono = { version = "0.4", features = ["serde", "clock"] }

# Networking helpers
hickory-resolver = "0.24"
url = "2"
x509-parser = "0.16"

# CLI / GUI
clap = { version = "4", features = ["derive"] }
eframe = "0.28"
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
egui_plot = "0.28"
egui-notify = "0.15"
rfd = "0.14"
arboard = "3"
image = "0.25"
crossbeam-channel = "0.5"

# Logging / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

# Module registration
inventory = "0.3"
regex = "1"
directories = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
