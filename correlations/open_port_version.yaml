id: open_port_version
version: 1
meta:
  name: "Service banner reveals version"
  description: "An open port banner discloses a software version."
  risk: MEDIUM
  scope: host
  author: "lancer-spiderfoot"
collections:
  - collect:
      - method: exact
        field: type
        value: 'TCP_PORT_OPEN_BANNER'
      - method: regex
        field: data
        value: '\d+\.\d+'
analysis:
  - method: threshold
    minimum: 1
headline: "Service banner discloses version: {data}"
