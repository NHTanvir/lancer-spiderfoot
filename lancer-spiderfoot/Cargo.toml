[package]
name = "lancer-spiderfoot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust clone of spiderfoot — part of the Lancer bug bounty toolkit (GUI + CLI + web)"

[[bin]]
name = "lancer-spiderfoot"
path = "src/main.rs"

[dependencies]
sf-core = { workspace = true }
sf-modules = { workspace = true }
sf-graph = { workspace = true }
sf-web = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
crossbeam-channel = { workspace = true }

# GUI
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui_plot = { workspace = true }
egui-notify = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }

[features]
default = []
wasm-modules = []
